<!DOCTYPE html>
<html>
<head>
    <title>Health Diagnosis System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Health Diagnosis</h1>
        <form id="diagnosisForm">
            <!-- Form fields would be dynamically generated based on your features -->
            <div class="form-group">
                <label for="symptom1">Symptom 1:</label>
                <input type="text" id="symptom1" name="symptom1" required>
            </div>
            <!-- Add more fields as needed -->
            <button type="submit">Diagnose</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('diagnosisForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = Object.fromEntries(new FormData(e.target));
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                if (result.error) {
                    document.getElementById('result').innerHTML = `Error: ${result.error}`;
                } else {
                    document.getElementById('result').innerHTML = `
                        Diagnosis: ${result.diagnosis}<br>
                        Confidence: ${result.confidence}%
                    `;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
